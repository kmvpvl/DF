    comboItems: [CreateComboItemInput!]
}

input ProductVariantInput {
    id: ID
    sku: String
    label: JSON! # Например: "100г", "Большая"
    isWeightBased: Boolean!
    locationPrices: [LocationVariantConfigInput!]!
    weight: Float!
