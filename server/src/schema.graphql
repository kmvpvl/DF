}

input UpdateMaterialInput {
    name: String
    description: String
    selfProduced: Boolean
    isPublicComposition: Boolean
    caloriesKcal: Float
    fatGrams: Float
    proteinGrams: Float
    carbohydratesGrams: Float
    sugarsGrams: Float
    fiberGrams: Float
    saltGrams: Float
    VAT: Float
    Price: Float
    purchaseUnit: String
    purchaseUnitAmount: Float
    consumptionUnit: String
    rateOfLoss: Float
    ratio: Float
