enum EntityType {
    INDIVIDUAL
    LEGAL_ENTITY
}

enum ProductType {
    SIMPLE
    COMBO
}

enum ContactRequestType {
    FEEDBACK
    FREE_TEST_BATCH
}

enum Role {
    CUSTOMER
    EMPLOYEE
    MANAGER
    ADMIN
    SUPERVISOR
}

scalar JSON

type MLString {
    default: String!
    ts: JSON
}

type User {
    id: ID!
    name: String!
    fullName: String!
    entityType: EntityType!
    phone: String
    email: String!
    bio: String
    tgId: String
    pib: String
    mbr: String
    account: String
    bank: String
    passwordHash: String!
    pushSubscription: JSON
    lang: String
    createdAt: String!
    updatedAt: String!
}

type Company {
    id: ID!
    name: String!
    locations: [Location!]!
    createdAt: String!
    updatedAt: String!
}

type Location {
    id: ID!
    name: String!
    timezone: String!
    currencyCode: String! # ISO 4217: "USD", "GEL", "RUB"
    currencySymbol: String! # "$", "₾", "₽"
    createdAt: String!
    updatedAt: String
}

type StockBalance {
    productId: String!
    locationId: String!
    physicalBalance: Float!
    reservedBalance: Float!
}

type Movement {
    id: ID!
    type: String!
    productId: ID!
    batchId: ID
    quantity: Float!
    groupId: ID
    createdAt: String!
}

input CreateUserInput {
    name: String!
    fullName: String!
    entityType: EntityType
    phone: String
    email: String!
    bio: String
    tgId: String
    pib: String
    mbr: String
    account: String
    bank: String
    password: String!
    lang: String
}

input SendContactMessageInput {
    type: ContactRequestType!
    name: String!
    email: String
    phone: String
    subject: String!
    message: String!
}

input OrderItemInput {
    productId: Int!
    name: String!
    qty: Int!
    unitPrice: Float!
    lineTotal: Float!
    variationLabel: String
    weightGrams: Float
}

input SendOrderInput {
    customerName: String!
    customerEmail: String!
    customerPhone: String!
    note: String
    items: [OrderItemInput!]!
    total: Float!
}

input UpdateSessionUserInput {
    name: String!
    fullName: String!
    entityType: EntityType
    phone: String
    email: String!
    pib: String
    mbr: String
    account: String
    bank: String
    lang: String
    pushSubscription: JSON
}

enum CleaningType {
    GENERAL
    CURRENT
    DISINFECTION
}

type Equipment {
    id: ID!
    numId: Int!
    fullName: String!
    createdAt: String!
    updatedAt: String!
}

type CleanAction {
    id: ID!
    equipment: Equipment!
    performer: User!
    supervisor: User!
    cleaningType: CleaningType!
    createdAt: String!
    updatedAt: String!
}

type Material {
    id: ID!
    name: String!
    description: String
    selfProduced: Boolean!
    isPublicComposition: Boolean!
    caloriesKcal: Float!
    fatGrams: Float!
    proteinGrams: Float!
    carbohydratesGrams: Float!
    sugarsGrams: Float!
    fiberGrams: Float!
    saltGrams: Float!
    VAT: Float!
    Price: Float!
    purchaseUnit: String!
    purchaseUnitAmount: Float!
    consumptionUnit: String!
    rateOfLoss: Float!
    ratio: Float!
    createdAt: String!
    updatedAt: String!
}

type Product {
    id: ID!
    name: MLString!
    batchPrefix: String!
    description: MLString!
    caloriesKcal: Float!
    fatGrams: Float!
    proteinGrams: Float!
    carbohydratesGrams: Float!
    sugarsGrams: Float!
    fiberGrams: Float!
    saltGrams: Float!
    standardDose: Float!
    units: JSON
    tags: JSON!
    photos: JSON!
    chapters: JSON!
    isPublic: Boolean!
    priority: Int!
    variants: [ProductVariant!]
    modifierGroups: [ProductModifierGroup!]
    comboItems: [ComboItem!]
    createdAt: String!
    updatedAt: String!
}

type ProductVariant {
    id: ID!
    productId: ID!
    sku: String
    label: MLString! # "100г", "Большая пицца"
    # Логика весового товара
    isWeightBased: Boolean!
    weight: Float! # Шаг веса или дефолтный вес в упаковке
    weightUnit: String! # "g", "kg"
    # Конфигурация цены и остатка для ТЕКУЩЕЙ локации пользователя
    locationPrices: [LocationVariantConfig!]
}

type PublicProduct {
    id: ID!
    name: MLString!
    description: MLString!
    photos: JSON!
    tags: JSON!
    chapters: JSON!
    isPublic: Boolean!
    priority: Int!
    standardDose: Float!
    units: MLString
    variants: [ProductVariant!]!
    modifierGroups: [ProductModifierGroup!]!
    comboItems: [ComboItem!]!

    stock: Float # вычисляемое или просто первый элемент массива
    reserved: Float
}

type ProductModifierGroup {
    id: ID!
    productId: ID!
    title: MLString! # "Выберите соус", "Добавить топпинги"
    isRequired: Boolean!
    minSelect: Int!
    maxSelect: Int!
    modifiers: [ProductModifier!]!
}

type ProductModifier {
    id: ID!
    groupId: ID!
    name: MLString! # "Двойной сыр"
    weight: Float
    weightUnit: String

    # Цена модификатора в ТЕКУЩЕЙ локации
    locationPrices: [LocationModifierConfig!]
}

type ComboItem {
    id: ID!
    comboId: ID!
    productId: ID!
    variantId: ID
    quantity: Int!

    # Дополнительно можно подтягивать сам продукт/вариант для фронтенда
    sourceProduct: Product!
}

# ==========================================
# 3. МАТРИЦА ЦЕН И ОСТАТКОВ
# ==========================================

"""
Цены и остатки конкретного варианта товара для текущей локации
"""
type LocationVariantConfig {
    id: ID!
    locationId: ID!
    variantId: ID!

    # Цены
    individualPrice: Float!
    legalEntityPrice: Float # null, если цена совпадает с обычной
    # Массивы скидок в формате JSON: [{ threshold: 10, discount: 5 }]
    individualDiscounts: JSON
    legalDiscounts: JSON

    # Склад
    stock: Float!
    isAvailable: Boolean!
}

type LocationModifierConfig {
    id: ID!
    locationId: ID!
    modifierId: ID!
    individualPrice: Float!
    legalEntityPrice: Float
    isAvailable: Boolean!
}

type StorageCondition {
    id: ID!
    name: String!
    createdAt: String!
    updatedAt: String!
}

type ProcessParameter {
    id: ID!
    name: String!
    value: String!
    unit: String!
}

type Ingredient {
    id: ID!
    product: Product
    material: Material
    amount: Float!
    unit: String!
}

type ProcessMap {
    id: ID!
    name: String!
    outcome: Float!
    rateOfLoss: Float!
    VAT: Float!
    containerCost: Float!
    dose: Float!
    marginalCoefficient: Float!
    productId: ID!
    parameters: [ProcessParameter!]!
    ingredients: [Ingredient!]!
    createdAt: String!
    updatedAt: String!
    outcomeUnit: String!
}

type Sample {
    id: ID!
    number: Int!
    numberStr: String!
    createdAt: String!
    updatedAt: String!
    studyAt: String
    result: String
    note: String
    batch: Batch!
}

type Batch {
    id: ID!
    product: Product!
    nettoWeight: Float!
    number: Int!
    numberStr: String!
    storageDurationDays: Int!
    storageCondition: StorageCondition!
    processMap: ProcessMap
    samples: [Sample!]!
    processDeviations: String
    certificate: Certificate
    createdAt: String!
    updatedAt: String!
}

scalar DateTime

enum OrderStatus {
    DRAFT
    PENDING
    COMPLETED
    CANCELLED
}

type Order {
    id: ID!
    number: String!
    numberInt: Int!
    customerName: String!
    customerUserId: String
    orderDate: DateTime!
    orderDateReady: DateTime
    status: OrderStatus!
    totalPrice: Float!
    isPaid: Boolean!
    paymentMethod: String
    deliveryAddress: String
    shippingMethod: String
    trackingNumber: String
    managerId: String
    notes: String
    createdAt: DateTime!
    updatedAt: DateTime!
    locationId: String!

    # Связи (Relations)
    products: [OrderProduct!]!
    # location: Location! # Раскомментируйте, когда добавите тип Location
}

type OrderProduct {
    id: ID!
    orderId: String!
    productId: String!
    quantity: Float!
    dateReady: DateTime
    createdAt: DateTime!
    updatedAt: DateTime!
    sortOrder: Int!
    totalPrice: Float!
    # Связи (Relations)
    order: Order!
    product: Product! # Раскомментируйте, когда добавите тип Product
}

input DiscountTierInput {
    threshold: Float! # Может быть Float для весовых товаров (например, от 1.5 кг)
    discount: Float! # Процент скидки (например, 10 для 10%)
}

# Inputs для мутаций (DTO)
input CreateOrderInput {
    id: ID
    number: String
    numberInt: Int
    customerName: String
    customerUserId: String
    orderDate: DateTime
    orderDateReady: DateTime
    status: OrderStatus!
    totalPrice: Float
    isPaid: Boolean
    paymentMethod: String
    deliveryAddress: String
    shippingMethod: String
    trackingNumber: String
    managerId: String
    notes: String
    createdAt: DateTime
    updatedAt: DateTime
    locationId: String

    # Связи (Relations)
    products: [OrderProductInput!]!
    # location: Location! # Раскомментируйте, когда добавите тип Location
}

input OrderProductInput {
    id: ID
    orderId: String
    productId: String!
    quantity: Float!
    dateReady: DateTime
    createdAt: DateTime
    updatedAt: DateTime
    sortOrder: Int
    totalPrice: Float
    # Связи (Relations)
}

input UpdateOrderInput {
    status: OrderStatus
    products: [OrderProductInput!]!
}

type Certificate {
    id: ID!
    number: Int!
    numberYear: Int!
    numberStr: String!
    createdAt: String!
    updatedAt: String!
    batch: Batch!
    extraCertificateData: String!
}

type CertificateBatchOption {
    id: ID!
    number: Int!
    numberStr: String!
    createdAt: String!
    nettoWeight: Float!
    storageDurationDays: Int!
    processDeviations: String
    product: Product!
    storageCondition: StorageCondition!
    processMap: ProcessMap
    samples: [Sample!]!
}

type CertificateDocument {
    fileName: String!
    mimeType: String!
    base64: String!
}

type BatchNumberPreview {
    number: Int!
    numberStr: String!
}

type ImportMaterialsCsvResult {
    importedCount: Int!
    skippedCount: Int!
    errors: [String!]!
}

type ImportProductsCsvResult {
    importedCount: Int!
    skippedCount: Int!
    errors: [String!]!
}

input CreateEquipmentInput {
    numId: Int!
    fullName: String!
}

input UpdateEquipmentInput {
    numId: Int
    fullName: String
}

input CreateCleanActionInput {
    equipmentId: ID!
    performerId: ID!
    supervisorId: ID!
    cleaningType: CleaningType!
}

input CreateMaterialInput {
    name: String!
    description: String
    selfProduced: Boolean!
    isPublicComposition: Boolean
    caloriesKcal: Float!
    fatGrams: Float!
    proteinGrams: Float!
    carbohydratesGrams: Float!
